<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beliarg: The Eternal Forge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Added Google Fonts for Hellish Atmosphere -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nosifer&family=Rye&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bg: {
                app: 'var(--bg-app)',
                panel: 'var(--bg-panel)',
                input: 'var(--bg-input)',
              },
              text: {
                primary: 'var(--text-primary)',
                secondary: 'var(--text-secondary)',
                muted: 'var(--text-muted)',
              },
              hell: {
                900: 'var(--hell-900)',
                800: 'var(--hell-800)',
                700: 'var(--hell-700)',
                600: 'var(--hell-600)',
                500: 'var(--hell-500)', 
                400: '#c92a2a',
                300: '#ff6b6b',
                lava: 'var(--hell-lava)', 
                gold: 'var(--hell-gold)',
                ash: 'var(--hell-ash)',
              }
            },
            fontFamily: {
              horror: ['Nosifer', 'cursive'],
              cinzel: ['Cinzel Decorative', 'serif'],
              serif: ['Rye', 'serif'],
              mono: ['Roboto Mono', 'monospace'],
              runic: ['serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flicker': 'flicker 3s infinite',
              'magma': 'magma 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'spin-reverse': 'spin 15s linear infinite reverse',
              'pupil-move': 'pupil-move 5s ease-in-out infinite',
              'pulse-demonic': 'pulse-demonic 3s ease-in-out infinite',
            },
            keyframes: {
              flicker: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0.7 },
              },
              magma: {
                '0%, 100%': { boxShadow: '0 0 10px var(--hell-lava), 0 0 20px var(--hell-500)' },
                '50%': { boxShadow: '0 0 20px var(--hell-gold), 0 0 40px #c92a2a' },
              },
              'pupil-move': {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '20%': { transform: 'translate(-3px, 1px)' },
                '40%': { transform: 'translate(3px, 0)' },
                '60%': { transform: 'translate(0, -2px)' },
                '80%': { transform: 'translate(-1px, 2px)' },
              },
              'pulse-demonic': {
                '0%, 100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                '50%': { transform: 'scale(1.05)', filter: 'brightness(1.3)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* Light Theme (Ash & Day) */
        color-scheme: light;
        --bg-app: #e5e5e5;
        --bg-panel: #f3f4f6;
        --bg-input: #ffffff;
        --text-primary: #111827;
        --text-secondary: #374151;
        --text-muted: #6b7280;

        --hell-900: #d1d5db;
        --hell-800: #e5e7eb;
        --hell-700: #9ca3af;
        --hell-600: #6b7280;
        --hell-500: #b91c1c;
        --hell-lava: #c2410c;
        --hell-gold: #b45309;
        --hell-ash: #4b5563;
      }

      [data-theme="dark"] {
        /* Dark Theme (Obsidian & Lava) - High Contrast Mode */
        color-scheme: dark; 
        --bg-app: #050505; /* Pure black background */
        --bg-panel: #160b0b; /* Slightly lighter black for panels */
        --bg-input: #1a0505;
        
        /* TEXT COLORS */
        --text-primary: #ffffff; 
        --text-secondary: #e0e0e0; /* Brighter gray */
        --text-muted: #a3a3a3;

        /* HELL ACCENTS - BOOSTED BRIGHTNESS */
        --hell-900: #1a0505; 
        --hell-800: #2e1212; 
        --hell-700: #802020; /* Visible red border */
        --hell-600: #b91c1c; 
        --hell-500: #ff5252; /* Neon Red */
        --hell-lava: #ff9f43; /* Orange-300: Much brighter for visibility */
        --hell-gold: #ffd700; /* Pure Gold */
        --hell-ash: #9ca3af;
      }

      /* Noise Texture Overlay */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Vignette Effect */
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 6;
        background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
      }

      [data-theme="dark"] ::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
        opacity: 0.8;
      }
      
      [data-theme="dark"] ::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
      }
      
      [data-theme="dark"] input::placeholder,
      [data-theme="dark"] textarea::placeholder {
        color: #888;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-app); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--hell-700); 
        border: 1px solid var(--hell-500);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--hell-lava); 
      }
      
      ::selection {
        background: var(--hell-500);
        color: white;
      }

      body {
        background-color: var(--bg-app);
        color: var(--text-primary);
        transition: background-color 0.5s ease, color 0.5s ease;
        min-height: 100vh;
      }
      
      [data-theme="dark"] body {
         background-image: radial-gradient(circle at 50% 0%, #3f0e0e 0%, #000000 100%);
      }
      
      [data-theme="light"] body {
         background-image: radial-gradient(circle at 50% 0%, #f3f4f6 0%, #d1d5db 100%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>
  <body>
    <div class="bg-noise"></div>
    <div class="vignette"></div>
    <div id="root"></div>
  </body>
</html>
